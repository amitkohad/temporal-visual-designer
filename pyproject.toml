[project]
name = "nexus-flow-designer"
version = "0.1.0"
description = "Python contract foundation for Nexus Flow Designer"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "h11>=0.16,<1",
    "jsonschema>=4.23,<5",
    "pydantic>=2.11,<3",
    "pyjwt[crypto]>=2.10,<3",
    "temporalio>=1.16,<2",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexusflow"]
exclude = ["nexusflow/tests"]

[project.scripts]
nexusflow-local = "nexusflow.apps.local:main"
nexusflow-check = "nexusflow.apps.cli:main"
nexusflow-export-schemas = "nexusflow.contracts.export:main"
nexusflow-project-schema = "nexusflow.modules.project_versioning.export:main"
nexusflow-binding-schema = "nexusflow.modules.designer_forms.export:main"
nexusflow-form-schemas = "nexusflow.modules.designer_forms.form_export:main"
nexusflow-bundle-schema = "nexusflow.modules.activity_catalog.export:main"

[tool.pytest.ini_options]
testpaths = ["nexusflow/tests"]
addopts = "-ra --strict-markers -m 'not integration'"
markers = ["integration: requires a disposable local Temporal server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["nexusflow/contracts", "nexusflow/apps", "nexusflow/modules/durable_runtime", "nexusflow/modules/identity_environments", "nexusflow/modules/project_versioning", "nexusflow/modules/designer_forms", "nexusflow/modules/designer_debugger", "nexusflow/modules/activity_catalog", "nexusflow/modules/package_promotion", "nexusflow/modules/human_tasks", "nexusflow/modules/connectors"]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "httpx>=0.28,<1",
    "httpx2>=2,<3",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.11,<1",
    "types-jsonschema>=4.23,<5",
]
